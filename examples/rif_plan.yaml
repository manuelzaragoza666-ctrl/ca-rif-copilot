# ---------------------------------------------------------------------------
# RIF plan — Selection Criteria Engine (module 2)
#
# One entry per department. Departments with no entry inherit `default`.
# Criteria may never reference a protected characteristic; the engine will
# refuse to load a plan that tries.
# ---------------------------------------------------------------------------

plan_name: "FY27 Restructuring — Scenario A"
as_of_date: 2026-10-30

# Annualized, fully loaded payroll savings sought across the organization.
cost_savings_target: 250000

# Base pay -> fully loaded cost. 1.25 assumes ~25% benefits and payroll burden.
burden_multiplier: 1.25

# Any employee scoring below this needs an explicit human decision rather than
# automatic selection. Set to null to disable.
manual_review_below: 15

# ---------------------------------------------------------------------------
# Default plan, inherited by any department not listed below.
# ---------------------------------------------------------------------------
default:
  mode: individual
  comparison_group: [department, job_level]
  criteria:
    performance:
      kind: performance
      source_column: performance_rating
      weight: 0.6
      higher_is_better: true
      required: true
      # Omit `scale` to use the built-in vocabulary, or pin your own:
      # scale: {"Exceeds": 4, "Meets": 3, "Below": 2}
    critical_skills:
      kind: skills
      source_column: skills
      weight: 0.4
      required: false
      critical_items: []
  notes: "Default policy; departments should override with real critical skills."

# ---------------------------------------------------------------------------
# Department overrides
# ---------------------------------------------------------------------------
departments:

  Engineering:
    mode: individual
    comparison_group: [department, job_level]
    criteria:
      performance:
        kind: performance
        source_column: performance_rating
        weight: 0.5
      critical_skills:
        kind: skills
        source_column: skills
        weight: 0.5
        required: true
        critical_items:
          - Python
          - Kubernetes
          - Distributed Systems
    protected_positions: []
    notes: "Platform migration continues through FY27; retain infra depth."

  Customer Success:
    mode: individual
    comparison_group: [department]
    criteria:
      performance:
        kind: performance
        source_column: performance_rating
        weight: 0.6
      critical_skills:
        kind: skills
        source_column: skills
        weight: 0.4
        critical_items:
          - Zendesk
          - Spanish
    max_headcount: 1
    notes: "Bilingual coverage is contractual; cap reductions at one."

  Marketing:
    # The role itself is going away, so selection happens at the position level
    # and individual performance does not enter into it.
    mode: position
    eliminate_positions:
      - Marketing Manager
    notes: "Brand function moving to agency; internal role eliminated."

  Operations:
    mode: individual
    comparison_group: [department]
    criteria:
      performance:
        kind: performance
        source_column: performance_rating
        weight: 0.5
      critical_skills:
        kind: skills
        source_column: skills
        weight: 0.5
        critical_items:
          - Forklift Operation
          - Inventory Systems
          - Vendor Management
    protected_positions:
      - Warehouse Associate
    notes: "Stockton site must retain licensed forklift coverage at all times."

  Finance:
    mode: individual
    comparison_group: [department]
    criteria:
      performance:
        kind: performance
        source_column: performance_rating
        weight: 0.5
      critical_skills:
        kind: skills
        source_column: skills
        weight: 0.5
        critical_items:
          - Financial Modeling
          - SQL
    max_savings_share: 0.15
    notes: "Close/audit cycle needs coverage; cap Finance at 15% of the target."
